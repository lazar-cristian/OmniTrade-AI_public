<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#121820" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sfondo arrotondato scuro -->
  <rect width="64" height="64" rx="14" fill="url(#gradBg)" stroke="rgba(0, 255, 163, 0.25)" stroke-width="2"/>

  <!-- Candele di trading stilizzate -->
  <line x1="20" y1="26" x2="20" y2="44" stroke="#00ffa3" stroke-width="2" stroke-linecap="round"/>
  <rect x="17" y="30" width="6" height="10" rx="1" fill="#00ffa3"/>

  <line x1="32" y1="18" x2="32" y2="48" stroke="#00ffa3" stroke-width="2" stroke-linecap="round"/>
  <rect x="29" y="22" width="6" height="16" rx="1" fill="#00ffa3"/>

  <!-- Curva quantistica AI / VWAP Mean Reversion con bagliore -->
  <path d="M 12 44 Q 24 16, 36 28 T 54 14" fill="none" stroke="url(#neonGreen)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Punto di arrivo impulso AI -->
  <circle cx="54" cy="14" r="3" fill="#00d2ff" filter="url(#glow)"/>
</svg>
